<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beerunng — Coming soon</title>
<meta name="description" content="Beerunng. Yet to be explored. Coming soon.">
<meta name="theme-color" content="#F6EEE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="fabric.jpg">
<script>document.documentElement.classList.add('js')</script>
<style>
  :root {
    --bg: #F6EEE3;
    --ink: #221E1C;
    --muted: #5E554F;
    --red: #7A1A1A;
    --pad: clamp(20px, 3.4vw, 56px);
    --gap: clamp(28px, 3.6vw, 64px);
    /* set from JS so type hugs the drape at every size */
    --dl: 38vw; --dr: 62vw; --floor: 84px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: Jost, 'Century Gothic', Futura, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--red); color: var(--bg); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  main { position: fixed; inset: 0; pointer-events: none; }
  .js main > *:not(form), .js form > * { opacity: 0; }


  header { position: absolute; top: var(--pad); left: var(--pad); right: var(--pad); display: flex; justify-content: space-between; align-items: baseline; }
  .mark { font-weight: 500; font-size: clamp(20px, 1.7vw, 26px); letter-spacing: .2em; }
  .mark sup { font-size: .48em; letter-spacing: 0; margin-right: .2em; }

  /* Right of the drape, upper third */
  .yet { position: absolute; left: calc(var(--dr) + var(--gap)); top: 19%; }
  .yet small { display: block; font-size: clamp(17px, 1.35vw, 22px); font-weight: 400; margin-bottom: .35em; }
  .word { display: inline-block; font-size: clamp(36px, 3.5vw, 58px); font-weight: 400; line-height: 1.05; color: var(--red); }
  .caret::after { content: ""; display: inline-block; width: 1.5px; height: .8em; margin-left: .16em; vertical-align: -.04em; background: currentColor; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Left of the drape, lower half, right-aligned so it leans into the cloth */
  .soon { position: absolute; right: calc(100% - var(--dl) + var(--gap)); top: 30%; text-align: right; }
  .soon h1 { font-weight: 300; font-size: clamp(46px, 5vw, 88px); line-height: .98; letter-spacing: -.015em; white-space: nowrap; }

  /* Cursor: pointing hand (Lucide "pointer", ISC) with three gold ripples from the fingertip */
  .cursor { position: fixed; left: 0; top: 0; width: 0; height: 0; z-index: 20; pointer-events: none; opacity: 0; }
  .hand { position: absolute; width: 30px; height: 30px; left: -10px; top: -3px; fill: var(--bg); stroke: currentColor; stroke-width: 1.3;
          stroke-linecap: round; stroke-linejoin: round; color: var(--ink); transition: color .35s, fill .35s, filter .35s; }
  .ring { position: absolute; left: -38px; top: -38px; width: 76px; height: 76px; border-radius: 50%;
          border: 1px solid #E3BD74; opacity: 0; }
  .cursor.on-cloth .hand { color: #FFF3DF; fill: transparent; filter: drop-shadow(0 0 5px rgba(255, 205, 130, .75)); }
  .cursor.on-cloth .ring { animation: ripple 2.4s cubic-bezier(.2, .6, .3, 1) infinite; }
  .ring:nth-of-type(2) { animation-delay: .8s !important; }
  .ring:nth-of-type(3) { animation-delay: 1.6s !important; }
  @keyframes ripple { 0% { transform: scale(.2); opacity: 0; } 18% { opacity: .95; } 100% { transform: scale(1.25); opacity: 0; } }
  .own-cursor, .own-cursor * { cursor: none; }
  .own-cursor form, .own-cursor form * { cursor: auto; }
  .own-cursor form input { cursor: text; }
  .own-cursor form button { cursor: pointer; }
  @media (prefers-reduced-motion: reduce) {
    /* still rings, like the concept board */
    .cursor.on-cloth .ring { animation: none; opacity: .7; }
    .ring:nth-of-type(1) { transform: scale(.45); } .ring:nth-of-type(2) { transform: scale(.72); } .ring:nth-of-type(3) { transform: scale(1); }
  }

  form {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--floor); pointer-events: auto;
    display: grid; grid-template-columns: auto 1fr minmax(200px, 340px) auto; align-items: center; gap: 28px;
    padding: 0 var(--pad) env(safe-area-inset-bottom);
    border-top: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
    font-size: 11px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase;
  }
  form label { white-space: nowrap; }
  .rule { height: 1px; background: currentColor; opacity: .25; transform-origin: left; }
  form input {
    font: inherit; letter-spacing: .12em; text-transform: none; color: var(--ink); font-size: 14px;
    background: none; border: 0; border-bottom: 1px solid color-mix(in srgb, var(--ink) 30%, transparent);
    min-height: 44px; padding: 0 2px; border-radius: 0; outline: none; transition: border-color .25s ease;
  }
  form input::placeholder { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .24em; }
  form input:focus-visible { border-color: var(--red); }
  form input[aria-invalid="true"] { border-color: var(--red); }
  form button {
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink);
    background: none; border: 0; cursor: pointer; min-height: 44px; padding: 0 4px;
    display: inline-flex; align-items: center; gap: 14px;
  }
  form button:focus-visible { outline: 1px solid var(--red); outline-offset: 4px; }
  form button svg { width: 26px; height: 10px; }
  .thanks { grid-column: 1 / -1; text-align: center; color: var(--red); }

  @media (max-aspect-ratio: 4/5) {
    /* Phones / portrait: drape centred, copy either side of it, as on the concept board */
    .mark { font-size: 18px; letter-spacing: .1em; }
    .yet { left: calc(var(--dr) + 10px); top: 34%; }
    .yet small { font-size: 14px; }
    .word { font-size: clamp(20px, 6vw, 30px); }
    .soon { right: auto; left: var(--pad); top: 44%; text-align: left; max-width: calc(var(--dl) - var(--pad) - 6px); }
    .soon h1 { font-size: clamp(24px, 6.6vw, 40px); white-space: normal; }
    form { grid-template-columns: 1fr auto; grid-template-rows: auto auto; align-content: center; gap: 2px 16px; }
    form label { grid-column: 1 / -1; font-size: 10px; }
    .rule { display: none; }
  }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>

<main>
  <header>
    <div class="mark" aria-label="Beerunng">Beerun<sup>n</sup>g</div>
  </header>

  <p class="yet" aria-live="polite">
    <small>Yet to be</small>
    <span class="word caret">Explored</span>
  </p>

  <div class="soon">
    <h1>Coming soon</h1>
  </div>

  <form novalidate>
    <label for="email">Join the community</label>
    <span class="rule" aria-hidden="true"></span>
    <input id="email" type="email" name="email" placeholder="Enter your email" autocomplete="email" required>
    <button type="submit">Join
      <svg viewBox="0 0 26 10" fill="none" stroke="currentColor" aria-hidden="true"><path d="M0 5h25M21 1l4 4-4 4"/></svg>
    </button>
  </form>
</main>

<div class="cursor" aria-hidden="true">
  <span class="ring"></span><span class="ring"></span><span class="ring"></span>
  <svg class="hand" viewBox="0 0 24 24"><use href="#hand"/></svg>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="hand" viewBox="0 0 24 24">
    <path d="M22 14a8 8 0 0 1-8 8"/><path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1"/>
    <path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10"/>
    <path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
  </symbol>
</svg>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@12.23.12/dist/motion.js"></script>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s) => document.querySelector(s);
const cv = $('canvas');
const img = new Image();
img.src = 'fabric.jpg';

// Where the hanging part of the drape sits inside the photo (fractions of its width).
const DRAPE = { l: .365, r: .725, cx: .54 };

// Everything the shader reads. GSAP tweens these; the ticker draws them.
const S = { glow: 0, pour: 0, x: -1e4, y: -1e4 };

const FRAG = `
precision highp float;
uniform sampler2D T;
uniform vec4 R;          // drape rect in canvas px (x, y-from-bottom, w, h)
uniform vec3 BG;
uniform vec2 M;          // pointer
uniform float glow, rad, fe, cx, pour, t;

float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

// Wide screens: past the photo's left/right edge, the floor pool continues as a mirror of its own folds
// (no stretching), fading out above the pool line so the hanging drape is never duplicated.
float mirrorX(float x) { return fe < .5 ? x : (x < 0. ? -x : (x > 1. ? 2. - x : x)); }

void main() {
  vec2 f = gl_FragCoord.xy;
  vec2 uv = (f - R.xy) / R.zw;
  float beyond = max(-uv.x, uv.x - 1.);                    // how far past the photo's side edge
  uv.x = mirrorX(uv.x);
  // Crisp but irregular top edge for the mirrored pool, like the rolled lip of heaped cloth.
  float poolTop = .252 + .014 * (sin(beyond * 9. + .4) * .6 + sin(beyond * 21. + 1.3) * .3 + sin(beyond * 4. + 2.) * .5);

  vec3 c = texture2D(T, clamp(uv, 0., 1.)).rgb;
  float inside = step(0., uv.x) * step(uv.x, 1.) * step(0., uv.y) * step(uv.y, 1.);
  float soft = mix(1., smoothstep(1., .9, uv.y)                                         // drape top dissolves into the wall
                     * mix(1., smoothstep(poolTop + .003, poolTop - .002, uv.y), smoothstep(0., .1, beyond)), fe); // mirrored pool only, never mirrored drape
  c = mix(BG, c, inside * soft);

  // Gold: light catching the cloth under the pointer only. Follows the folds, never touches the wall.
  float fabric = smoothstep(.35, .7, (c.r - max(c.g, c.b)) / (c.r + .02));
  float fold = smoothstep(0., .14, dot(c, vec3(.299, .587, .114)));
  vec2 d = f - M;
  float spot = exp(-dot(d, d) / (rad * rad));
  // The stream: from the touch, gold runs down the fold to the floor and fans out across the pool,
  // with slow pulses of light travelling downward.
  float below = max(-d.y, 0.);
  float reach = max(M.y - R.y, 1.) * pour;
  float onFloor = smoothstep(R.y + R.w * .3, R.y + R.w * .16, f.y);
  float w = rad * (.26 + below / (R.w * 1.1) + onFloor * .9);
  float stream = exp(-d.x * d.x / (w * w)) * step(d.y, 0.) * smoothstep(reach, reach * .65, below)
               * exp(-below / (R.w * .7)) * (.55 + .45 * sin(below / (rad * .55) - t * 3.2));
  float light = max(spot, stream * .9) * glow;
  vec3 gold = mix(vec3(.40, .25, .06), vec3(.98, .80, .44), fold) + pow(fold, 3.) * vec3(.45, .38, .22);
  c = mix(c, gold, light * fabric * pow(fold, mix(.6, 1.1, step(spot, stream)))); // stream favours the ridges

  c += (hash(f) - .5) * .02;   // fine grain, keeps gradients from banding
  gl_FragColor = vec4(c, 1.);
}`;

const gl = cv.getContext('webgl', { antialias: false });
const U = {};
let dpr = 1, rect = [0, 0, 1, 1], portrait = false;

// JS twin of the shader's mirrorX(), so the cursor knows what cloth is under it.
const mirrorX = (u) => portrait ? u : u < 0 ? -u : u > 1 ? 2 - u : u;

function initGL() {
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) return false;
  gl.useProgram(p);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
  for (const k of ['S', 'T']) gl.texParameteri(gl.TEXTURE_2D, gl['TEXTURE_WRAP_' + k], gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  for (const k of ['R', 'BG', 'M', 'glow', 'rad', 'fe', 'cx', 'pour', 't']) U[k] = gl.getUniformLocation(p, k);
  gl.uniform1f(U.cx, DRAPE.cx);
  return true;
}

function layout() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  portrait = innerWidth / innerHeight < .8;
  const floor = $('form').offsetHeight;
  const avail = innerHeight - floor;
  // Both: the drape is centred on screen and fills it, as in the concept board.
  // Portrait covers the screen outright; landscape runs the cloth up past the top and spreads the pool edge to edge.
  const s = portrait ? Math.max(avail / img.height, innerWidth / img.width) : avail * 1.5 / img.height;
  const w = img.width * s, h = img.height * s;
  let x = innerWidth / 2 - w * DRAPE.cx;
  if (portrait) x = Math.min(0, Math.max(innerWidth - w, x));
  rect = [x * dpr, floor * dpr, w * dpr, h * dpr];

  const root = document.documentElement.style;
  root.setProperty('--dl', `${x + w * DRAPE.l}px`);
  root.setProperty('--dr', `${x + w * DRAPE.r}px`);
  root.setProperty('--floor', `${floor}px`);

  if (gl && U.R) { gl.viewport(0, 0, cv.width, cv.height); gl.uniform1f(U.fe, portrait ? 0 : 1); }
  draw();
}

function draw() {
  if (!U.R) return;
  gl.uniform4fv(U.R, rect);
  gl.uniform2f(U.M, S.x, S.y);
  gl.uniform1f(U.glow, S.glow);
  gl.uniform1f(U.rad, (portrait ? 70 : 110) * dpr);
  gl.uniform1f(U.pour, S.pour);
  gl.uniform1f(U.t, reduce ? 0 : performance.now() / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// Draw only while something is moving; a still page costs nothing.
let busy = 0;
const hold = () => { if (busy++ === 0) gsap.ticker.add(draw); };
const release = () => { if (--busy === 0) { gsap.ticker.remove(draw); draw(); } };

/* ---------- Pointer: a single soft spot of gold that glides after the cursor ---------- */
const toX = gsap.quickTo(S, 'x', { duration: .45, ease: 'power3.out' });
const toY = gsap.quickTo(S, 'y', { duration: .45, ease: 'power3.out' });
let idle, lit = false;

function onPointer(e) {
  const x = e.clientX * dpr, y = cv.height - e.clientY * dpr;
  if (S.glow < .02) gsap.set(S, { x, y });        // appear where the cursor is, don't slide in
  toX(x); toY(y);
  if (!lit) {
    lit = true; hold();
    gsap.to(S, { glow: 1, duration: .6, ease: 'power2.out', overwrite: 'auto' });
    gsap.fromTo(S, { pour: 0 }, { pour: 1, duration: 1.8, ease: 'power2.out' });   // light runs down to the floor
  }
  clearTimeout(idle);
  idle = setTimeout(fade, e.pointerType === 'mouse' ? 1600 : 900);
}
function fade() {
  if (!lit) return;
  lit = false;
  gsap.to(S, { glow: 0, duration: 1.4, ease: 'power2.inOut', overwrite: 'auto', onComplete: release });
}

/* ---------- Cursor: hand + gold ripples, lit only over the cloth ---------- */
const cur = $('.cursor');
const curX = gsap.quickTo(cur, 'x', { duration: .16, ease: 'power3.out' });
const curY = gsap.quickTo(cur, 'y', { duration: .16, ease: 'power3.out' });
let clothPx = null;                                  // photo pixels, for "is the pointer on the cloth?"

function overCloth(x, y) {
  if (!clothPx) return false;
  const u0 = (x * dpr - rect[0]) / rect[2], u = mirrorX(u0), v = 1 - (cv.height - y * dpr - rect[1]) / rect[3];
  if (u < 0 || u > 1 || v < 0 || v > 1) return false;
  if (u !== u0 && v < .76) return false;                                   // mirrored area above the pool line is wall
  const i = (((v * (img.height - 1)) | 0) * img.width + ((u * (img.width - 1)) | 0)) * 4;
  const r = clothPx[i];
  return (r - Math.max(clothPx[i + 1], clothPx[i + 2])) / (r + 5) > .5;   // same red-dominance test as the shader
}
function moveCursor(e) {
  const touch = e.pointerType !== 'mouse';
  if (touch || gsap.getProperty(cur, 'opacity') < .05) gsap.set(cur, { x: e.clientX, y: e.clientY });
  curX(e.clientX); curY(e.clientY);
  cur.classList.toggle('on-cloth', overCloth(e.clientX, e.clientY));
  const hide = !touch && e.target.closest?.('form');                    // native cursor over the signup
  gsap.to(cur, { opacity: hide ? 0 : 1, duration: .25, overwrite: 'auto' });
}
function initCursor() {
  const t = document.createElement('canvas');
  t.width = img.width; t.height = img.height;
  const tc = t.getContext('2d', { willReadFrequently: true });
  tc.drawImage(img, 0, 0);
  clothPx = tc.getImageData(0, 0, img.width, img.height).data;
  if (matchMedia('(pointer: fine)').matches) document.documentElement.classList.add('own-cursor');
  addEventListener('pointermove', moveCursor, { passive: true });
  addEventListener('pointerdown', moveCursor, { passive: true });
  addEventListener('pointerup', (e) => e.pointerType !== 'mouse' && gsap.to(cur, { opacity: 0, duration: .6, delay: 1.2, overwrite: 'auto' }));
  document.documentElement.addEventListener('pointerleave', () => gsap.to(cur, { opacity: 0, duration: .25, overwrite: 'auto' }));
}

/* ---------- Boot ---------- */
img.onload = () => {
  const c = document.createElement('canvas').getContext('2d');
  c.drawImage(img, 0, 0, 1, 1, 0, 0, 1, 1);
  const [r, g, b] = c.getImageData(0, 0, 1, 1).data;
  document.documentElement.style.setProperty('--bg', `rgb(${r},${g},${b})`);

  if (gl && initGL()) gl.uniform3f(U.BG, r / 255, g / 255, b / 255);
  else {
    // No WebGL: plain drawn image, no sheen.
    const ctx = cv.getContext('2d');
    window.draw = draw = () => { ctx.fillStyle = `rgb(${r},${g},${b})`; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, rect[0], cv.height - rect[1] - rect[3], rect[2], rect[3]); };
  }
  addEventListener('resize', layout);
  layout();
  initCursor();

  if (reduce) {
    // Still cloth with one restrained, pre-set glint; copy shown as is.
    Object.assign(S, { glow: .55, pour: 1, x: rect[0] + rect[2] * .6, y: rect[1] + rect[3] * .45 });
    draw();
    gsap.set('main > *, form > *', { opacity: 1 });
    return;
  }
  addEventListener('pointermove', onPointer, { passive: true });
  addEventListener('pointerdown', onPointer, { passive: true });
  addEventListener('pointerup', (e) => e.pointerType !== 'mouse' && fade());
  intro();
};

function intro() {
  gsap.fromTo(cv, { opacity: 0 }, { opacity: 1, duration: 1.8, ease: 'power2.out' });
  gsap.delayedCall(.5, copyIn);
}

function copyIn() {
  const split = SplitText.create('.soon h1', { type: 'chars,words', mask: 'chars', aria: 'auto' });
  gsap.timeline({ defaults: { ease: 'expo.out' } })
    .to('header', { opacity: 1, duration: 1.2, ease: 'power2.out' }, 0)
    .set('.soon', { opacity: 1 }, .5)
    .from(split.chars, { yPercent: 110, duration: 1.1, stagger: .03, onComplete: () => split.revert() }, .5) // unmask so descenders aren't clipped
    .fromTo('.yet', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.2 }, .9)
    .from('.rule', { scaleX: 0, duration: 1.4, ease: 'power3.inOut' }, .8)
    .set('.rule', { opacity: .25 }, .8)
    .fromTo('form > :not(.rule)', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .9, stagger: .08 }, 1)
    .add(rotate, 3);
}

const words = ['Explored', 'Shaped', 'Lived'];
function rotate() {
  const el = $('.word');
  let i = 0;
  gsap.timeline({ repeat: -1, repeatDelay: 2.4 })
    .to(el, { opacity: 0, y: -10, filter: 'blur(4px)', duration: .5, ease: 'power2.in' })
    .call(() => { el.textContent = words[i = (i + 1) % words.length]; })
    .fromTo(el, { y: 10, filter: 'blur(4px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: .8, ease: 'power3.out' });
}


/* ---------- Signup: Motion for hover / press feedback ---------- */
const { animate, hover, press } = Motion;
const form = $('form'), input = $('#email'), btn = $('form button'), arrow = btn.querySelector('svg');
if (!reduce) {
  hover(btn, () => { animate(arrow, { x: 6 }, { type: 'spring', stiffness: 300, damping: 18 });
    return () => animate(arrow, { x: 0 }, { type: 'spring', stiffness: 300, damping: 22 }); });
  press(btn, () => { animate(btn, { scale: .96 }, { duration: .12 });
    return () => animate(btn, { scale: 1 }, { type: 'spring', stiffness: 400, damping: 20 }); });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!input.checkValidity()) {
    input.setAttribute('aria-invalid', 'true');
    input.focus();
    if (!reduce) animate(input, { x: [0, -6, 6, -4, 4, 0] }, { duration: .4 });
    return;
  }
  // ponytail: no signup backend yet — emails are NOT stored. Wire this to a list (Vercel function, Mailchimp, etc.) before launch.
  if (!reduce) await animate([...form.children], { opacity: 0, y: -6 }, { duration: .3 });
  form.innerHTML = '<p class="thanks" role="status">Thank you. Let’s see how it unfolds.</p>';
  if (!reduce) animate(form.firstChild, { opacity: [0, 1], y: [8, 0] }, { duration: .6 });
});
input.addEventListener('input', () => input.removeAttribute('aria-invalid'));
</script>
</body>
