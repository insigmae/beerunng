<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beerunng — Coming soon</title>
<meta name="description" content="Beerunng. Coming soon.">
<meta name="theme-color" content="#F2F0EF">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preload" as="image" href="logo-wordmark.svg">
<!-- Brand type is Century Gothic Paneuropean (installed with Windows / Microsoft Office on macOS).
     Questrial is only the fallback for devices without it, until licensed web-font files are self-hosted. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
  /* Beerunng visual identity: Pine Grove type on Off-white, Matte Beige as the quiet accent. */
  :root {
    --bg: #F2F0EF;        /* Off-white */
    --ink: #223631;       /* Pine Grove */
    --muted: rgba(34, 54, 49, .72);
    --beige: #E1CFB9;     /* Matte Beige */
    --pad: clamp(20px, 3.6vw, 60px);
    --font: 'Century Gothic Paneuropean', 'Century Gothic', CenturyGothic, 'URW Gothic', Questrial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: var(--font); font-weight: 400;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--beige); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  main { position: fixed; inset: 0; pointer-events: none; }
  .js main > *, .js .soon > * { opacity: 0; }

  /* Small caps set like the guidelines' labels: Century Gothic Regular, modest tracking. */
  .caps { font-size: 12px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; line-height: 1.9; }
  .rule { display: block; width: 26px; height: 1px; background: currentColor; opacity: .55; margin-top: 18px; }

  .top { position: absolute; top: var(--pad); left: var(--pad); }

  /* The painting fills the screen. Desktop copy is one column in the open sky right of the man:
     logo on top, Coming soon beneath, both on the same left/right edges.
     Positions come from the artwork's on-screen box (--ax/--ay/--aw/--ah, set from JS) so nothing lands on the cloth;
     --mb is the masthead's bottom edge. */
  .masthead { position: absolute; left: calc(var(--ax) + var(--aw) * .55); right: var(--pad); top: calc(var(--pad) + 18px); }
  .mark { display: block; width: 100%; height: auto; }
  .soon { position: absolute; left: calc(var(--ax) + var(--aw) * .55); right: var(--pad); top: calc(var(--mb) + 4vh);
          pointer-events: auto; container-type: inline-size; }
  .num { display: block; font-weight: 400; color: var(--muted); }
  .num .sq { font-size: .8em; margin-right: .7em; }                         /* the ■ brand accent, used once */
  .soon h1 { font-weight: 700; font-size: clamp(30px, min(9.4cqw, 9vh), 104px); line-height: 1; letter-spacing: -.02em;
             margin-top: 1.2vh; white-space: nowrap; }
  .soon .rule { width: 72px; margin: 2.6vh 0 2.4vh; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 1.6vh clamp(20px, 3vw, 56px); }
  .row p { flex: none; }
  .row form { flex: 1; min-width: 230px; }

  form { position: relative; display: flex; align-items: center; border: 1px solid rgba(34, 54, 49, .6);
         background: rgba(242, 240, 239, .4); backdrop-filter: blur(2px); }
  form input { flex: 1; min-width: 0; font: inherit; font-size: 13px; letter-spacing: .14em; color: var(--ink); background: none; border: 0;
               min-height: 48px; padding: 0 0 0 18px; outline: none; }
  form input::placeholder { color: var(--muted); font-size: 11px; letter-spacing: .28em; text-transform: uppercase; }
  form:focus-within { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  form input[aria-invalid="true"] { text-decoration: underline wavy rgba(34, 54, 49, .6); text-underline-offset: 4px; }
  form button { background: none; border: 0; color: var(--ink); cursor: pointer; width: 54px; min-height: 48px; display: grid; place-items: center; }
  form button:focus-visible { outline: 1px solid var(--ink); outline-offset: -6px; }
  form button svg { width: 22px; height: 12px; }
  .thanks { padding: 15px 18px; color: var(--ink); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* Cursor: a small circle; over the drape it opens out into three gold rings rippling from the pointer. */
  .cursor { position: fixed; left: 0; top: 0; width: 0; height: 0; z-index: 20; pointer-events: none; opacity: 0; }
  .dot { position: absolute; left: -8px; top: -8px; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ink);
         transition: transform .45s cubic-bezier(.2, .7, .3, 1), opacity .35s ease, border-color .35s ease; }
  .ring { position: absolute; left: -38px; top: -38px; width: 76px; height: 76px; border-radius: 50%; border: 1px solid #E3BD74; opacity: 0; }
  .cursor.on-cloth .dot { transform: scale(2.6); opacity: 0; border-color: #E3BD74; }   /* the circle becomes the rings */
  .cursor.on-cloth .ring { animation: ripple 2.4s cubic-bezier(.2, .6, .3, 1) infinite; }
  .ring:nth-of-type(2) { animation-delay: .8s !important; }
  .ring:nth-of-type(3) { animation-delay: 1.6s !important; }
  @keyframes ripple { 0% { transform: scale(.2); opacity: 0; } 18% { opacity: .95; } 100% { transform: scale(1.25); opacity: 0; } }
  .own-cursor, .own-cursor * { cursor: none; }
  .own-cursor form, .own-cursor form * { cursor: auto; }
  .own-cursor form input { cursor: text; }
  .own-cursor form button { cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    .cursor.on-cloth .ring { animation: none; opacity: .7; }
    .ring:nth-of-type(1) { transform: scale(.45); } .ring:nth-of-type(2) { transform: scale(.72); } .ring:nth-of-type(3) { transform: scale(1); }
  }

  @media (min-aspect-ratio: 4/5) and (max-aspect-ratio: 3/2) {
    /* Squarish screens (4:3 tablets, small windows): narrower column, so the signup stacks under the line. */
    .soon .num { display: none; }
    .soon h1 { margin-top: 0; }
    .soon .rule { margin: 1.8vh 0 1.6vh; }
    .row { display: block; }
    .row form { margin-top: 1.6vh; }
  }

  @media (min-aspect-ratio: 4/5) and (max-height: 700px) {
    /* Short landscape screens: tighter, to finish above the wall. */
    .soon { top: calc(var(--mb) + 2.6vh); }
    .soon .num { display: none; }
    .soon h1 { margin-top: 0; }
    .soon .rule { margin: 1.6vh 0 1.4vh; }
    form input, form button { min-height: 42px; }
  }

  @media (max-aspect-ratio: 4/5) {
    /* Phones: logo across the top above the man; Coming soon in the sky beside him. */
    .masthead { left: var(--pad); top: calc(var(--pad) + 24px); }
    .soon { left: calc(var(--ax) + var(--aw) * .5); top: max(calc(var(--ay) + var(--ah) * .15), calc(var(--mb) + 14px)); }
    .soon h1 { font-size: clamp(28px, min(8.6vw, 4.8vh), 56px); margin-top: 1.4vh; white-space: normal; }
    .soon .rule { width: 48px; margin: 14px 0 12px; }
    .row { display: block; }
    .row form { min-width: 0; margin-top: 14px; }
    .soon p.caps { font-size: 10px; letter-spacing: .1em; }
    form input { padding-left: 12px; min-height: 44px; font-size: 16px; }
    form input::placeholder { font-size: 10px; letter-spacing: .02em; }
    form button { width: 42px; min-height: 44px; }
  }
  @media (max-aspect-ratio: 4/5) and (max-height: 700px) {
    /* Short phones: the man stands close to the top, so the logo moves into the sky beside him, over Coming soon;
       the block drops its number and spacing. */
    .masthead { left: calc(var(--ax) + var(--aw) * .5); }   /* same left edge as Coming soon */
    .soon .num { display: none; }
    .soon h1 { margin-top: 0; }
    .soon .rule { margin: 10px 0 8px; }
    .row form { margin-top: 10px; }
    form input::placeholder { letter-spacing: .02em; }
  }
  @media (max-aspect-ratio: 4/5) and (min-width: 600px) {
    /* Portrait tablets: the man reaches the top, so the logo sits in the sky beside him, over Coming soon. */
    .masthead, .soon { left: calc(var(--ax) + var(--aw) * .5); }
    .soon { top: calc(var(--mb) + 3vh); }
  }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>

<main>
  <header class="top caps">India / 2026</header>

  <div class="masthead">
    <img class="mark" src="logo-wordmark.svg" alt="Beerunng" width="1210" height="183">
  </div>

  <section class="soon">
    <span class="num caps"><span class="sq" aria-hidden="true">■</span>01</span>
    <h1>Coming Soon</h1>
    <span class="rule"></span>
    <div class="row">
    <p class="caps">Join the community.<br>See how it unfolds.</p>
    <form novalidate>
      <label for="email" class="sr">Email address</label>
      <input id="email" type="email" name="email" placeholder="Enter your email" autocomplete="email" required>
      <button type="submit" aria-label="Join">
        <svg viewBox="0 0 22 12" fill="none" stroke="currentColor"><path d="M0 6h21M16 1l5 5-5 5"/></svg>
      </button>
    </form>
    </div>
  </section>
</main>

<div class="cursor" aria-hidden="true">
  <span class="ring"></span><span class="ring"></span><span class="ring"></span>
  <span class="dot"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@12.23.12/dist/motion.js"></script>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s) => document.querySelector(s);
const cv = $('canvas');

// Two artworks: landscape for wide screens, portrait for phones.
// `man` is the figure's box in image pixels (x0, y0, x1, y1, top-down): the glow belongs to the drape only.
const ART = {
  wide: { src: 'art-desktop.jpg', man: [228, 92, 482, 472] },
  tall: { src: 'art-mobile.jpg',  man: [48, 186, 398, 738] },
};

// Everything the shader reads. GSAP tweens these; the ticker draws them.
const S = { glow: 0, pour: 0, x: -1e4, y: -1e4 };

const FRAG = `
precision highp float;
uniform sampler2D T;
uniform vec4 R;          // artwork rect in canvas px (x, y-from-bottom, w, h)
uniform vec4 MAN;        // figure box in uv (u0, v0, u1, v1), excluded from the glow
uniform vec2 M;          // pointer
uniform float glow, rad, pour, t;

const vec3 BG = vec3(242., 240., 239.) / 255.;          // brand Off-white
const vec3 PAPER = vec3(253., 252., 248.) / 255.;       // the artwork's own paper white

float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

void main() {
  vec2 f = gl_FragCoord.xy;
  vec2 uv = (f - R.xy) / R.zw;
  vec3 c = texture2D(T, clamp(uv, 0., 1.)).rgb * (BG / PAPER);   // re-tone paper to brand Off-white

  // Gold: light catching the drape under the pointer, following its folds. Never the wall, sky or the man.
  float man = step(MAN.x, uv.x) * step(uv.x, MAN.z) * step(MAN.y, uv.y) * step(uv.y, MAN.w);
  float lum = dot(c, vec3(.299, .587, .114));
  float fabric = smoothstep(.35, .7, (c.r - max(c.g, c.b)) / (c.r + .02)) * smoothstep(.24, .16, lum) * (1. - man);
  float fold = smoothstep(0., .14, lum);
  vec2 d = f - M;
  float spot = exp(-dot(d, d) / (rad * rad));
  // The stream: from the touch, gold runs down the cloth and widens as it goes, pulsing downward.
  float below = max(-d.y, 0.);
  float reach = max(M.y - R.y, 1.) * pour;
  float w = rad * (.26 + below / (R.w * .8));
  float stream = exp(-d.x * d.x / (w * w)) * step(d.y, 0.) * smoothstep(reach, reach * .65, below)
               * exp(-below / (R.w * .7)) * (.55 + .45 * sin(below / (rad * .55) - t * 3.2));
  float light = max(spot, stream * .9) * glow;
  vec3 gold = mix(vec3(.40, .25, .06), vec3(.98, .80, .44), fold) + pow(fold, 3.) * vec3(.45, .38, .22);
  c = mix(c, gold, light * fabric * pow(fold, mix(.6, 1.1, step(spot, stream))));

  c += (hash(f) - .5) * .018;   // fine grain, keeps gradients from banding
  gl_FragColor = vec4(c, 1.);
}`;

const gl = cv.getContext('webgl', { antialias: false });
const U = {};
const tex = {};
let dpr = 1, rect = [0, 0, 1, 1], art = null, portrait = false;

function initGL(images) {
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) return false;
  gl.useProgram(p);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  for (const k in images) {
    tex[k] = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex[k]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, images[k]);
    for (const w of ['S', 'T']) gl.texParameteri(gl.TEXTURE_2D, gl['TEXTURE_WRAP_' + w], gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  }
  for (const k of ['R', 'MAN', 'M', 'glow', 'rad', 'pour', 't']) U[k] = gl.getUniformLocation(p, k);
  return true;
}

function layout() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  portrait = innerWidth / innerHeight < .8;
  art = portrait ? ART.tall : ART.wide;
  const im = art.img;
  // The painting covers the whole screen, centred.
  const s = Math.max(innerWidth / im.width, innerHeight / im.height);
  const w = im.width * s, h = im.height * s, x = (innerWidth - w) / 2, y = (innerHeight - h) / 2;
  rect = [x * dpr, (innerHeight - y - h) * dpr, w * dpr, h * dpr];
  const root = document.documentElement.style;                     // the artwork's box, for anchoring the copy
  root.setProperty('--ax', `${x}px`);
  root.setProperty('--ay', `${y}px`);
  root.setProperty('--aw', `${w}px`);
  root.setProperty('--ah', `${h}px`);
  root.setProperty('--mb', `${$('.mark').getBoundingClientRect().bottom}px`);   // after --ax/--aw: the logo depends on them
  if (U.R) {
    gl.viewport(0, 0, cv.width, cv.height);
    gl.bindTexture(gl.TEXTURE_2D, tex[portrait ? 'tall' : 'wide']);
    const [x0, y0, x1, y1] = art.man;
    gl.uniform4f(U.MAN, x0 / im.width, 1 - y1 / im.height, x1 / im.width, 1 - y0 / im.height);
  }
  draw();
}

function draw() {
  if (!U.R) return;
  gl.uniform4fv(U.R, rect);
  gl.uniform2f(U.M, S.x, S.y);
  gl.uniform1f(U.glow, S.glow);
  gl.uniform1f(U.rad, (portrait ? 70 : 110) * dpr);
  gl.uniform1f(U.pour, S.pour);
  gl.uniform1f(U.t, reduce ? 0 : performance.now() / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// Draw only while something is moving; a still page costs nothing.
let busy = 0;
const hold = () => { if (busy++ === 0) gsap.ticker.add(draw); };
const release = () => { if (--busy === 0) { gsap.ticker.remove(draw); draw(); } };

/* ---------- Pointer: gold glides after the cursor and pours down the cloth ---------- */
const toX = gsap.quickTo(S, 'x', { duration: .45, ease: 'power3.out' });
const toY = gsap.quickTo(S, 'y', { duration: .45, ease: 'power3.out' });
let idle, lit = false;

function onPointer(e) {
  const x = e.clientX * dpr, y = cv.height - e.clientY * dpr;
  if (S.glow < .02) gsap.set(S, { x, y });        // appear where the cursor is, don't slide in
  toX(x); toY(y);
  if (!lit) {
    lit = true; hold();
    gsap.to(S, { glow: 1, duration: .6, ease: 'power2.out', overwrite: 'auto' });
    gsap.fromTo(S, { pour: 0 }, { pour: 1, duration: 1.8, ease: 'power2.out' });   // light runs down the cloth
  }
  clearTimeout(idle);
  idle = setTimeout(fade, e.pointerType === 'mouse' ? 1600 : 900);
}
function fade() {
  if (!lit) return;
  lit = false;
  gsap.to(S, { glow: 0, duration: 1.4, ease: 'power2.inOut', overwrite: 'auto', onComplete: release });
}

/* ---------- Cursor: small circle that becomes gold ripples over the drape ---------- */
const cur = $('.cursor');
const curX = gsap.quickTo(cur, 'x', { duration: .16, ease: 'power3.out' });
const curY = gsap.quickTo(cur, 'y', { duration: .16, ease: 'power3.out' });

function pixels(a) {                                 // artwork pixels, for "is the pointer on the drape?"
  if (a.px) return a.px;
  const t = document.createElement('canvas');
  t.width = a.img.width; t.height = a.img.height;
  const c = t.getContext('2d', { willReadFrequently: true });
  c.drawImage(a.img, 0, 0);
  return (a.px = c.getImageData(0, 0, t.width, t.height).data);
}
function overCloth(x, y) {
  const im = art.img;
  const u = (x * dpr - rect[0]) / rect[2], v = 1 - (cv.height - y * dpr - rect[1]) / rect[3];
  if (u < 0 || u > 1 || v < 0 || v > 1) return false;
  const px = Math.floor(u * (im.width - 1)), py = Math.floor(v * (im.height - 1));
  const [x0, y0, x1, y1] = art.man;
  if (px >= x0 && px <= x1 && py >= y0 && py <= y1) return false;
  const d = pixels(art), i = (py * im.width + px) * 4, r = d[i];
  const lum = (.299 * r + .587 * d[i + 1] + .114 * d[i + 2]) / 255;
  return (r - Math.max(d[i + 1], d[i + 2])) / (r + 5) > .5 && lum < .2;   // same test as the shader
}
function moveCursor(e) {
  const touch = e.pointerType !== 'mouse';
  if (touch || gsap.getProperty(cur, 'opacity') < .05) gsap.set(cur, { x: e.clientX, y: e.clientY });
  curX(e.clientX); curY(e.clientY);
  cur.classList.toggle('on-cloth', overCloth(e.clientX, e.clientY));
  const hide = !touch && e.target.closest?.('form');                    // native cursor over the signup
  gsap.to(cur, { opacity: hide ? 0 : 1, duration: .25, overwrite: 'auto' });
}
function initCursor() {
  if (matchMedia('(pointer: fine)').matches) document.documentElement.classList.add('own-cursor');
  addEventListener('pointermove', moveCursor, { passive: true });
  addEventListener('pointerdown', moveCursor, { passive: true });
  addEventListener('pointerup', (e) => e.pointerType !== 'mouse' && gsap.to(cur, { opacity: 0, duration: .6, delay: 1.2, overwrite: 'auto' }));
  document.documentElement.addEventListener('pointerleave', () => gsap.to(cur, { opacity: 0, duration: .25, overwrite: 'auto' }));
}

/* ---------- Boot ---------- */
const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const first = innerWidth / innerHeight < .8 ? 'tall' : 'wide';
load(ART[first].src).then(async (im) => {
  ART[first].img = im;
  const other = first === 'tall' ? 'wide' : 'tall';
  ART[other].img = await load(ART[other].src).catch(() => im);       // the second one is only for rotating/resizing

  if (!(gl && initGL({ wide: ART.wide.img, tall: ART.tall.img }))) {
    const ctx = cv.getContext('2d');                                   // no WebGL: plain artwork, no glow
    window.draw = draw = () => ctx.drawImage(art.img, rect[0], cv.height - rect[1] - rect[3], rect[2], rect[3]);
  }
  addEventListener('resize', layout);
  layout();
  initCursor();

  if (reduce) {
    // Still artwork with one restrained, pre-set glint on the drape; copy shown as is.
    Object.assign(S, { glow: .55, pour: 1, x: rect[0] + rect[2] * .6, y: rect[1] + rect[3] * .3 });
    draw();
    gsap.set('main > *, .soon > *', { opacity: 1 });
    return;
  }
  addEventListener('pointermove', onPointer, { passive: true });
  addEventListener('pointerdown', onPointer, { passive: true });
  addEventListener('pointerup', (e) => e.pointerType !== 'mouse' && fade());
  intro();
});

function intro() {
  gsap.fromTo(cv, { opacity: 0 }, { opacity: 1, duration: 2.2, ease: 'power2.out' });
  const h1 = SplitText.create('.soon h1', { type: 'lines', mask: 'lines', aria: 'auto' });
  gsap.timeline({ defaults: { ease: 'expo.out' }, delay: .4 })
    .to('.top', { opacity: 1, duration: 1.2, ease: 'power2.out' }, 0)
    .set('.masthead', { opacity: 1 }, .2)
    // wordmark is drawn on left to right, like a line being written
    .fromTo('.mark', { clipPath: 'inset(0 100% 0 0)', opacity: .2 }, { clipPath: 'inset(0 0% 0 0)', opacity: 1, duration: 1.8, ease: 'power3.inOut' }, .2)
    .set('.soon', { opacity: 1 }, .9)
    .to('.soon > :not(h1)', { opacity: 1, duration: 1, stagger: .1 }, 1.3)
    .set('.soon h1', { opacity: 1 }, 1)
    .from(h1.lines, { yPercent: 105, duration: 1.3, stagger: .12, onComplete: () => h1.revert() }, 1);
}

/* ---------- Signup: Motion for hover / press feedback ---------- */
const { animate, hover, press } = Motion;
const form = $('form'), input = $('#email'), btn = $('form button'), arrow = btn.querySelector('svg');
if (!reduce) {
  hover(btn, () => { animate(arrow, { x: 4 }, { type: 'spring', stiffness: 300, damping: 18 });
    return () => animate(arrow, { x: 0 }, { type: 'spring', stiffness: 300, damping: 22 }); });
  press(btn, () => { animate(btn, { scale: .94 }, { duration: .12 });
    return () => animate(btn, { scale: 1 }, { type: 'spring', stiffness: 400, damping: 20 }); });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!input.checkValidity()) {
    input.setAttribute('aria-invalid', 'true');
    input.focus();
    if (!reduce) animate(form, { x: [0, -6, 6, -4, 4, 0] }, { duration: .4 });
    return;
  }
  // ponytail: no signup backend yet — emails are NOT stored. Wire this to a list (Vercel function, Mailchimp, etc.) before launch.
  if (!reduce) await animate([...form.children], { opacity: 0 }, { duration: .25 });
  form.innerHTML = '<p class="thanks caps" role="status">Thank you. See how it unfolds.</p>';
  if (!reduce) animate(form.firstChild, { opacity: [0, 1] }, { duration: .6 });
});
input.addEventListener('input', () => input.removeAttribute('aria-invalid'));
</script>
</body>
